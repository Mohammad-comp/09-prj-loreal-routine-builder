<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’Oréal | Routine Builder</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
</head>
<body>
  <header class="masthead"><span class="wordmark">L’ORÉAL <small>PARIS</small></span><button id="direction" type="button" aria-pressed="false">RTL layout</button></header>
  <main>
    <header class="intro"><h1>Build your routine.</h1><p>Discover products, save your favorites, and get a routine built around your picks.</p></header>
    <div class="workspace">
      <section aria-labelledby="catalogTitle">
        <h2 id="catalogTitle">Explore products</h2>
        <div class="filters">
          <label for="search">Search products<input type="search" id="search" dir="auto" placeholder="Name, brand, or ingredient"></label>
          <label for="categoryFilter">Category<select id="categoryFilter"><option value="">All categories</option></select></label>
        </div>
        <p id="catalogStatus" role="status">Loading products…</p>
        <div id="productsContainer" class="products-grid"></div>
      </section>
      <aside>
        <section class="panel" aria-labelledby="selectedTitle">
          <div class="section-heading"><h2 id="selectedTitle">Your picks</h2><button id="clear" class="quiet" type="button" disabled>Clear all</button></div>
          <p id="selectionStatus" role="status">No products selected.</p>
          <ul id="selectedProductsList"></ul>
          <button id="generate" class="primary" type="button" disabled>Generate routine</button>
        </section>
        <section class="panel" aria-labelledby="chatTitle">
          <h2 id="chatTitle">Routine chat</h2>
          <div id="chatWindow" role="log" aria-labelledby="chatTitle" tabindex="0"><p>Generate a routine to start the conversation.</p></div>
          <p id="chatStatus" role="status"></p>
          <form id="chatForm">
            <label for="question">Follow-up question</label>
            <div class="chat-controls"><input id="question" dir="auto" maxlength="1000" placeholder="What should I use first?" required disabled><button id="send" type="submit" disabled>Send</button></div>
          </form>
        </section>
      </aside>
    </div>
  </main>
</body>
</html>
